name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Backend CI: Python / Poetry / Pytest
  # ==========================================
  backend-ci:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-v3-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-v3-${{ runner.os }}-${{ matrix.python-version }}-

      # Explicitly point Poetry to the backend directory from the root
      - name: Install dependencies
        run: poetry -C backend install --no-interaction --no-root --with dev

      - name: Lint with flake8
        run: |
          poetry -C backend run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          poetry -C backend run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Format check with Black
        run: poetry -C backend run black --check .

      - name: Import sort check with isort
        run: poetry -C backend run isort --check-only --profile black .

      - name: Run unit tests with pytest
        run: poetry -C backend run pytest --cov=src --cov-report=xml --cov-report=term-missing tests/
        env:
          PYTHONPATH: backend/src

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ==========================================
  # Frontend CI: Next.js / TypeScript / ESLint
  # ==========================================
  frontend-ci:
    name: Frontend (Next.js & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set upNode.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build