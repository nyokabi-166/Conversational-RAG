[tool.poetry]
name = "rag-backend"
version = "0.1.0"
description = "FastAPI & LangChain/LlamaIndex RAG service"
authors = ["Your Name <you@example.com>"]

packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6"
python-dotenv = "^1.0"
streamlit = "^1.64.0"
pypdf = "^6.19.0"
langchain-core = "^1.1.0"
langchain-groq = "^1.1.0"
langchain-community = "^0.4.0"
langchain-chroma = "^1.1.0"
sentence-transformers = "^6.1.0"
fastapi = "^0.142.2"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
gunicorn = "^26.2.0"
psycopg2 = "^2.9.13"
sqlalchemy = "^2.1.2"
alembic = "^1.20.0"
databases = {extras = ["postgresql"], version = "^0.9.0"}
pyjwt = "^2.15.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-cov = "^5.0"
flake8 = "^7.0"
black = "^24.3"
isort = "^5.13"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
