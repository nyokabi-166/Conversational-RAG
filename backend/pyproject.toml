[tool.poetry]
name = "rag-backend"
version = "0.1.0"
description = "FastAPI & LangChain/LlamaIndex RAG service"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1,<10.0"
pytest-cov = ">=5,<8"
flake8 = "^7.0"
black = ">=24.3,<27.0"
isort = ">=5.13,<10.0"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
