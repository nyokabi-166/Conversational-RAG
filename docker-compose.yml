version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Relational Database: PostgreSQL 15.4 (Sessions, Messages, Accounts)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15.4-alpine
    container_name: rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-airline_rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airline_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Vector Database: ChromaDB 0.4.22 (Embeddings & Semantic Search)
  # ----------------------------------------------------------------------------
  chroma:
    image: chromadb/chroma:0.4.22
    container_name: rag-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - rag-network

  # ----------------------------------------------------------------------------
  # 3. Backend Service: FastAPI & LangChain RAG Orchestration
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-airline_rag}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started
    networks:
      - rag-network

  # ----------------------------------------------------------------------------
  # 4. Frontend Web Interface: Next.js / React
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
